server:
  port: 8088
spring:
  application:
    name: scraper

management:
  metrics:
    export:
      prometheus:
        enabled: true
  endpoints:
    web:
      exposure:
        include: 'prometheus,health,info,metrics,logfile'
  endpoint:
    health:
      probes:
        enabled: true
      enabled: true
      show-details: always
    info:
      enabled: true
    metrics:
      enabled: true
    logfile:
      enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
    defaults:
      enabled: true
    diskspace:
      enabled: true
    rabbit:
      enabled: true
  info:
    defaults:
      enabled: true
    env:
      enabled: true

logging:
  file:
    name: /log/app.log