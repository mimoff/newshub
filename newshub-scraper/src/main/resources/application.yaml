server:
  port: 8088
spring:
  application:
    name: newshub

management:
  metrics:
    export:
      prometheus:
        enabled: true
  endpoints:
    web:
      exposure:
        include: 'prometheus,health,info,metrics'
  endpoint:
    health:
      probes:
        enabled: true
      enabled: true
      show-details: always
    info:
      enabled: true
    metrics:
      enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
    defaults:
      enabled: true
    diskspace:
      enabled: true
    rabbit:
      enabled: true
  info:
    defaults:
      enabled: true
    env:
      enabled: true
