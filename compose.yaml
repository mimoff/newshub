services:
  rabbitmq:
    image: rabbitmq:management
    environment:
      - 'RABBITMQ_DEFAULT_PASS=guest'
      - 'RABBITMQ_DEFAULT_USER=guest'
    ports:
      - "5672:5672"
      - "15672:15672"

  app:
    build:
      context: newshub-scraper
    ports:
      - "8088:8088"
