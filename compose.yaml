services:
  rabbitmq:
    image: rabbitmq:management
    environment:
      - 'RABBITMQ_DEFAULT_PASS=guest'
      - 'RABBITMQ_DEFAULT_USER=guest'
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
#    restart: unless-stopped

  scraper:
    build:
      context: .
      args:
        MODULE: newshub-scraper
    image: newshub-scraper:latest
    container_name: newshub-scraper
    ports:
      - "8088:8088"
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: "5672"
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
      #LOGGING_FILE_NAME: ""
    depends_on:
      rabbitmq:
        condition: service_healthy

  newshub:
    build:
      context: .
      args:
        MODULE: newshub-service
    image: newshub-service:latest
    container_name: newshub-service
    ports:
      - "8080:8080"
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: "5672"
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
      #LOGGING_FILE_NAME: ""
    depends_on:
      rabbitmq:
        condition: service_healthy
