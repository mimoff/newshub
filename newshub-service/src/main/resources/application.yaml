server:
  port: 8080

spring:
  application:
    name: newshub

  datasource:
    url: jdbc:h2:mem:maindb
  sql:
    init:
      mode: always
      data-locations: classpath:data.sql
      schema-locations: classpath:schema.sql

  jpa:
    generate-ddl: false
    hibernate:
      ddl-auto: none

    show-sql: true
    properties:
      hibernate:
      #format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

app:
  jwt:
    secret: "change-me-in-production-this-must-be-a-very-long-secret-key-at-least-256-bits"
    expiration: 86400000  # 24 часа

#logging:
#  level:
#    org.springframework: debug
