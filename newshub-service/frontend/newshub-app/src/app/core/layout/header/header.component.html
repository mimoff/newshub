<mat-toolbar color="primary" class="app-toolbar">
  <a routerLink="/stories" class="brand">News Hub</a>

  <span class="spacer"></span>

  @if (auth.isLoggedIn()) {
    <button mat-button [matMenuTriggerFor]="accountMenu" class="account-button">
      <mat-icon>account_circle</mat-icon>
      <span class="role-label">{{ auth.role() }}</span>
    </button>

    <mat-menu #accountMenu="matMenu">
      @if (auth.isAdmin()) {
        <a mat-menu-item routerLink="/admin">
          <mat-icon>admin_panel_settings</mat-icon>
          <span>Источники данных</span>
        </a>
        <mat-divider />
      }
      <button mat-menu-item (click)="auth.logout()">
        <mat-icon>logout</mat-icon>
        <span>Выйти</span>
      </button>
    </mat-menu>
  } @else {
    <a mat-button routerLink="/login">Войти</a>
    <a mat-button routerLink="/register">Регистрация</a>
  }
</mat-toolbar>
